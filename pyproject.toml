[project]
name = "reachy-voice-agent"
version = "0.1.0"
description = "Live voice + vision conversational agent for Reachy Mini, powered by build.nvidia.com"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["reachy", "robotics", "nvidia", "nim", "riva", "voice-agent", "vlm"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.0",
    "numpy>=1.26",
    "websockets>=12.0",       # WebRTC signalling: producer discovery
    "python-multipart>=0.0.9", # file uploads (sounds)
    "nvidia-riva-client>=2.20", # Riva ASR + TTS over NVCF gRPC
]

[project.optional-dependencies]
# Strongly recommended: keeps audio on-device until the wake phrase is heard.
# Without it, every utterance in earshot goes to cloud ASR for wake matching.
local-wake = ["faster-whisper>=1.0"]

[project.scripts]
reachy-voice = "voice_agent:main"

[project.urls]
Homepage = "https://github.com/nileshai/reachy-voice-agent"
Issues = "https://github.com/nileshai/reachy-voice-agent/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["voice_agent", "server"]

[tool.setuptools.package-data]
"*" = ["static/*.html"]
